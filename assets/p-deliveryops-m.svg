<svg xmlns="http://www.w3.org/2000/svg" width="400" height="286" viewBox="0 0 400 286" role="img" aria-label="DeliveryOps: Multi-agent platform for application-maintenance teams. Agents read the project's real data (Jira exports, the contract, timesheets, meeting transcripts) and prepare the pre-invoice, the steering committee deck and the capacity plan. Nothing is applied until a person approves it."><title>DeliveryOps: Multi-agent platform for application-maintenance teams. Agents read the project's real data (Jira exports, the contract, timesheets, meeting transcripts) and prepare the pre-invoice, the steering committee deck and the capacity plan. Nothing is applied until a person approves it.</title><style>@font-face{font-family:'IC';src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'FR';src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'PM';src:url(data:font/woff2;base64,) format('woff2')}.flow{stroke-dasharray:3 5;animation:flow 1.6s linear infinite}@keyframes flow{to{stroke-dashoffset:-16}}.ping{animation:ping 7s ease-in-out infinite;opacity:0}@keyframes ping{0%,70%{opacity:0}80%{opacity:1}100%{opacity:0}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect x="0.5" y="0.5" width="399" height="285" rx="16" fill="#171210" stroke="#3a2c25" stroke-width="1"/><text x="36.0" y="52.0" font-family="IC" font-size="26" fill="#d8432f" text-anchor="middle" >󰚩</text><text x="64.0" y="52.0" font-family="FR" font-size="26" fill="#efe6d8" text-anchor="start" >DeliveryOps</text><text x="378.0" y="52.0" font-family="IC" font-size="14" fill="#8a7b6d" text-anchor="end" ></text><text x="22.0" y="90.0" font-family="PM" font-size="13" fill="#c4b8a7" text-anchor="start" >Multi-agent platform for</text><text x="22.0" y="110.0" font-family="PM" font-size="13" fill="#c4b8a7" text-anchor="start" >application-maintenance teams. Agents</text><text x="22.0" y="130.0" font-family="PM" font-size="13" fill="#c4b8a7" text-anchor="start" >read the project's real data (Jira</text><text x="22.0" y="150.0" font-family="PM" font-size="13" fill="#c4b8a7" text-anchor="start" >exports, the contract, timesheets,</text><text x="22.0" y="170.0" font-family="PM" font-size="13" fill="#c4b8a7" text-anchor="start" >meeting transcripts) and prepare the</text><text x="22.0" y="190.0" font-family="PM" font-size="13" fill="#c4b8a7" text-anchor="start" >pre-invoice, the steering committee deck</text><text x="22.0" y="210.0" font-family="PM" font-size="13" fill="#c4b8a7" text-anchor="start" >and the capacity plan. Nothing is</text><text x="22.0" y="230.0" font-family="PM" font-size="13" fill="#c4b8a7" text-anchor="start" >applied until a person approves it.</text><text x="22.0" y="264.0" font-family="PM" font-size="11.5" fill="#8a7b6d" text-anchor="start" >FastAPI, LangGraph, Angular</text></svg>